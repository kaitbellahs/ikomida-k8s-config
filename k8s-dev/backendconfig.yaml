apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  namespace: ikomida
  name: gateway-backendconfig
spec:
  healthCheck:
    checkIntervalSec: 30
    timeoutSec: 5
  customRequestHeaders:
    headers:
      - "X-Client-Region: {client_region}"
      - "X-Client-SubRegion: {client_region_subdivision}"
      - "X-Client-City: {client_city}"
      - "X-Client-CityLatLong: {client_city_lat_long}"
      - "X-Client-IpAddress: {client_ip_address}"
  securityPolicy:
    name: web-policy
